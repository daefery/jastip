<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>PayPal Jastip · flow prototype</title>
<style>
:root{
  --ink:#0c1b3a;
  --ink-2:#45506a;
  --ink-3:#6b7387;
  --paper:#f4efe6;
  --card:#ffffff;
  --line:#e3dccd;
  --kraft:#efe3cb;
  --kraft-2:#e2d1ae;
  --receipt:#fffdf6;
  --blue:#0a5bd3;
  --blue-2:#0846a3;
  --blue-soft:#e4edfd;
  --green:#0d7a4f;
  --green-soft:#def3e9;
  --amber:#a85600;
  --amber-soft:#fff0d9;
  --rose:#b42344;
  --yellow:#ffc439;
  --navy:#0b1838;
  --navy-2:#13265a;
  --navy-line:#2a3d73;
  --on-navy:#e9eefc;
  --on-navy-2:#a9b6dd;

  --r-phone:36px;
  --r-sheet:22px;
  --r-card:16px;
  --r-tag:10px;
  --r-btn:14px;

  --sh-card:0 1px 0 rgba(12,27,58,.06),0 6px 18px -10px rgba(12,27,58,.35);
  --sh-phone:0 30px 60px -30px rgba(11,24,56,.55),0 0 0 1px rgba(11,24,56,.08);

  --font:"Ubuntu Sans","DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Ubuntu Sans Mono","IPAGothic","WenQuanYi Zen Hei Mono",ui-monospace,monospace;
  --jp:"IPAGothic","WenQuanYi Zen Hei",sans-serif;

  --dock-h:112px;
  --guide-h:72px;
}
@media (min-width:700px){:root{--dock-h:72px}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--dock-h) + 8px);scroll-padding-bottom:calc(var(--guide-h) + 16px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--font);font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- dock ---------- */
.dock{position:sticky;top:0;z-index:30;background:rgba(244,239,230,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.dock-row{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"mark act" "stages stages";gap:6px 8px;align-items:center;padding:8px 10px 4px;max-width:1440px;margin:0 auto}
.mark{grid-area:mark;display:flex;align-items:center;gap:6px;margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.mark .ic{width:26px;height:26px;color:var(--blue);stroke-width:2}
.mark small{display:none;font-size:12px;font-weight:600;color:var(--ink-3);margin-left:2px;align-self:flex-end;padding-bottom:3px}
@media (min-width:420px){.mark small{display:inline}}
.dock-act{grid-area:act;display:flex;gap:6px;justify-content:flex-end;align-items:center;min-width:0}
.stages{grid-area:stages;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;min-width:0}
.stg{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;min-height:48px;padding:4px 0;border:0;border-radius:12px;background:transparent;cursor:pointer;color:var(--ink-3);font-size:12px;font-weight:600;min-width:0}
.stg>span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stg .dot{position:relative;display:grid;place-items:center;width:30px;height:30px;border-radius:999px;background:#fff;border:1.5px solid var(--line)}
.stg .dot .ic{width:17px;height:17px}
.stg[aria-current="step"]{color:var(--ink)}
.stg[aria-current="step"] .dot{background:var(--ink);border-color:var(--ink);color:#fff}
.stg.done{color:var(--ink-2)}
.stg.done .dot{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.stg:hover .dot{border-color:var(--ink-3)}

.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg-b{display:flex;align-items:center;gap:6px;min-height:40px;min-width:44px;padding:0 4px;border:0;border-radius:999px;background:transparent;cursor:pointer;font-weight:600;font-size:14px}
.seg-b .seg-t{display:none}
.seg-b[aria-pressed="true"] .seg-t{display:inline;padding-right:6px}
.seg-b[aria-pressed="true"]{background:var(--ink);color:#fff}
.money-btn{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:999px;border:0;background:var(--navy);color:var(--on-navy);cursor:pointer;font-weight:700;font-size:14px}
.money-btn .ic{width:18px;height:18px}
.money-t{display:none}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;flex:none}
#replay-top{display:none}
@media (min-width:700px){#replay-top{display:grid}}
.icon-btn .ic{width:20px;height:20px}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:0;max-width:1440px;margin:0 auto;padding:0 0 calc(var(--guide-h) + 20px)}
.phone{display:flex;flex-direction:column;background:#fbf8f2;min-height:calc(100dvh - var(--dock-h) - var(--guide-h))}
body[data-role="dina"] #ph-friend,body[data-role="friend"] #ph-dina{display:none}
.ph-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px 8px;border-bottom:1px solid var(--line);background:#fbf8f2;position:relative;z-index:2}
.ph-who{display:flex;align-items:center;gap:8px;margin:0;font-size:16px;font-weight:700}
.ph-who small{font-size:13px;color:var(--ink-3);font-weight:500}
.ph-place{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-2);font-weight:600}
.ph-place .ic{width:16px;height:16px}
.ph-body{position:relative;flex:1;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
.friend-tabs{display:flex;gap:6px}
.ftab{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 10px 0 4px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;font-weight:600}
.ftab[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ftab .ft-n{display:none}
.ftab[aria-pressed="true"] .ft-n{display:inline}
.ftab.wants{position:relative}
.ftab.wants::after{content:"";position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:999px;background:var(--rose);border:2px solid #fff}

/* rail = bottom sheet on phones */
.rail{position:fixed;left:0;right:0;bottom:0;z-index:40;max-height:84dvh;overflow:auto;background:var(--navy);color:var(--on-navy);border-radius:var(--r-sheet) var(--r-sheet) 0 0;transform:translateY(105%);transition:transform .28s ease;box-shadow:0 -20px 40px -20px rgba(0,0,0,.5)}
.rail.open{transform:none}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(11,24,56,.42)}
.rail-in{padding:10px 16px 28px}

/* guide */
.guide{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:32;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 8px 8px 12px;border-radius:18px;background:var(--ink);color:#fff;box-shadow:0 14px 30px -14px rgba(11,24,56,.7);font-weight:600;font-size:15px;line-height:1.3}
.guide .g-t{flex:1;min-width:0}
.guide .g-n{font-size:12px;color:var(--on-navy-2);font-weight:600;white-space:nowrap}
.guide .g-go{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;border:0;background:var(--yellow);color:var(--ink);font-weight:700;cursor:pointer;white-space:nowrap}
.guide .g-go .ic{width:18px;height:18px}

.toast{position:fixed;left:50%;top:calc(var(--dock-h) + 8px);z-index:45;transform:translate(-50%,-12px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--navy);color:var(--on-navy);font:600 13px/1.2 var(--mono);transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .ic{width:16px;height:16px;color:var(--yellow)}

.foot{max-width:1440px;margin:0 auto;padding:8px 16px calc(var(--guide-h) + 36px)}

/* ---------- tablet: phone + money rail ---------- */
@media (min-width:700px){
  .dock-row{grid-template-columns:auto 1fr auto;grid-template-areas:"mark stages act";padding:8px 20px}
  .stages{max-width:520px;margin:0 auto;width:100%}
  .stage{grid-template-columns:minmax(340px,400px) minmax(300px,420px);justify-content:center;gap:24px;padding:20px 20px calc(var(--guide-h) + 24px);align-items:start}
  .phone{min-height:0;height:min(820px,calc(100dvh - var(--dock-h) - var(--guide-h) - 60px));min-height:600px;border-radius:var(--r-phone);box-shadow:var(--sh-phone);overflow:hidden;border:8px solid var(--navy)}
  .ph-body{overflow:auto}
  .rail{position:sticky;top:calc(var(--dock-h) + 20px);transform:none;max-height:none;border-radius:var(--r-sheet);box-shadow:none;transition:none}
  .money-btn,.scrim{display:none!important}
  .guide{left:50%;right:auto;transform:translateX(-50%);width:min(720px,calc(100% - 32px))}
  .foot{padding:0 20px calc(var(--guide-h) + 40px)}
}
/* ---------- laptop and up: both phones + money in the middle ---------- */
@media (min-width:1080px){
  .stage{grid-template-columns:minmax(330px,390px) minmax(320px,440px) minmax(330px,390px);gap:28px}
  body[data-role] #ph-dina,body[data-role] #ph-friend{display:flex}
  .seg{display:none}
  .money-t{display:inline}
  .stage{padding-top:24px}
}
@media (min-width:1600px){
  .stage{grid-template-columns:400px 480px 400px;gap:40px}
}

.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.art{width:44px;height:44px;flex:none}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:999px;background:var(--c,#7a5af8);color:#fff;font-size:14px;font-weight:800;flex:none}
.av-dina{--c:#0c1b3a}
.av.sm{width:24px;height:24px;font-size:11px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:var(--r-btn);border:0;font-weight:700;font-size:16px;cursor:pointer;width:100%}
.btn .ic{width:20px;height:20px}
.btn-ink{background:var(--ink);color:#fff}
.btn-pp{background:var(--yellow);color:#0b1838}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}
.btn[disabled]{background:#e7e2d7;color:var(--ink-3);cursor:not-allowed}
.btn.sm{min-height:44px;font-size:15px;padding:0 14px;width:auto}

/* the ring that says "press me": 3 pulses then still */
.cue{position:relative;z-index:1}
.cue::after{content:"";position:absolute;inset:-5px;border-radius:inherit;border:3px solid var(--blue);pointer-events:none;animation:cue 1.1s ease-out 3}
.cue{box-shadow:0 0 0 3px var(--blue)}
@keyframes cue{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.12)}}

/* big status */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:8px 0 2px}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1}
.hero .sub{font-size:14px;color:var(--ink-2);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--blue-soft);color:var(--blue-2)}
.pill .ic{width:15px;height:15px}
.pill.g{background:var(--green-soft);color:var(--green)}
.pill.a{background:var(--amber-soft);color:var(--amber)}
.pill.n{background:#ece7dc;color:var(--ink-2)}

/* trip card = boarding pass */
.pass{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:14px 16px;border-radius:var(--r-card);background:#fff;box-shadow:var(--sh-card);position:relative}
.pass::before,.pass::after{content:"";position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:999px;background:#fbf8f2}
.pass::before{left:-9px}.pass::after{right:-9px}
.pass .city{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1}
.pass .cn{font-size:12px;color:var(--ink-3);font-weight:600}
.pass .to{text-align:right}
.pass .mid{display:flex;flex-direction:column;align-items:center;color:var(--blue);font-size:12px;font-weight:700}
.pass .mid .ic{width:24px;height:24px}

/* luggage tags = requests */
.tags{display:flex;flex-direction:column;gap:10px}
.tag{--tc:var(--kraft);position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 12px 10px 26px;border-radius:var(--r-tag);background:var(--tc);clip-path:polygon(14px 0,100% 0,100% 100%,14px 100%,0 calc(100% - 14px),0 14px)}
.tag::before{content:"";position:absolute;left:9px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:999px;background:#fbf8f2;box-shadow:inset 0 0 0 2px var(--kraft-2)}
.tag .t-n{font-weight:700;font-size:15px;line-height:1.25}
.tag .t-m{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);font-weight:600;margin-top:2px}
.tag .t-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tag .amt{font-size:17px;font-weight:800}
.tag .cap{font-size:12px;color:var(--ink-3);font-weight:600}
.tag.held{--tc:#e9f0fc}
.tag.held::before{box-shadow:inset 0 0 0 2px #b8cbef}
.tag.found{--tc:var(--green-soft)}
.tag.found::before{box-shadow:inset 0 0 0 2px #a8dcc3}
.tag.swap{--tc:var(--amber-soft)}
.tag.none{--tc:#eceae4;color:var(--ink-3)}
.tag.none .t-n{text-decoration:line-through}
.tag.paid{--tc:var(--green-soft)}
.tag.new{animation:tagin .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes tagin{from{transform:translateY(-14px) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}

.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.how li{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:12px;border-radius:14px;background:#fff;box-shadow:var(--sh-card)}
.how li .ic{grid-row:1/3;width:26px;height:26px;color:var(--blue)}
.how li b{font-size:15px;line-height:1.2}
.how li span{font-size:12.5px;color:var(--ink-3);font-weight:600;line-height:1.25}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 0;font-size:13px;font-weight:700;color:var(--ink-2)}

/* shelf (camera view) */
.shelf{position:relative;border-radius:var(--r-card);background:linear-gradient(#2b2f3a,#1b1e26);padding:14px 12px 12px;color:#fff;overflow:hidden}
.shelf .vf{position:absolute;inset:8px;border-radius:12px;pointer-events:none;background:
 linear-gradient(#fff,#fff) left top/22px 3px no-repeat,linear-gradient(#fff,#fff) left top/3px 22px no-repeat,
 linear-gradient(#fff,#fff) right top/22px 3px no-repeat,linear-gradient(#fff,#fff) right top/3px 22px no-repeat,
 linear-gradient(#fff,#fff) left bottom/22px 3px no-repeat,linear-gradient(#fff,#fff) left bottom/3px 22px no-repeat,
 linear-gradient(#fff,#fff) right bottom/22px 3px no-repeat,linear-gradient(#fff,#fff) right bottom/3px 22px no-repeat;opacity:.8}
.shelf .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 6px 10px;border-bottom:6px solid #4a4f5c}
.shelf .slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:10px;border:2px solid transparent}
.shelf .slot .art{width:52px;height:52px}
.shelf .price{font:700 12px/1 var(--mono);background:#fff;color:#111;padding:3px 5px;border-radius:4px}
.shelf .slot.hit{border-color:var(--yellow);background:rgba(255,196,57,.12)}
.shelf .slot .who{position:absolute;top:-6px;right:-4px}
.shelf .slot.miss{opacity:.55}
.shelf .lbl{display:flex;align-items:center;gap:6px;margin:10px 4px 0;font-size:13px;color:#d7dbe6;font-weight:600}
.shelf .lbl .ic{width:16px;height:16px;color:var(--yellow)}

/* receipt strip */
.rc{position:relative;background:var(--receipt);padding:14px 16px 20px;border-radius:6px 6px 0 0;box-shadow:var(--sh-card);font:500 13.5px/1.55 var(--mono);color:#222;--z:8px;
 -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - var(--z)) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/calc(var(--z)*2) var(--z) repeat-x;
 mask:linear-gradient(#000 0 0) top/100% calc(100% - var(--z)) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/calc(var(--z)*2) var(--z) repeat-x}
.rc .shop{text-align:center;font-family:var(--jp);font-weight:700;font-size:14px}
.rc .when{text-align:center;font-size:11.5px;color:#666}
.rc hr{border:0;border-top:1.5px dashed #aaa;margin:8px 0}
.rc .ln{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;min-height:32px;opacity:0;transform:translateY(-4px)}
.rc .ln.on{opacity:1;transform:none;transition:opacity .25s,transform .25s}
.rc .ln .jp{font-family:var(--jp);font-size:13px;line-height:1.3}
.rc .ln .p{font-weight:700}
.rc .ln .who{width:24px;height:24px}
.rc .ln.mine{background:linear-gradient(90deg,rgba(10,91,211,.09),transparent);border-radius:6px}
.rc .tot{display:flex;justify-content:space-between;font-weight:800;font-size:15px}
.rc.mini{padding:12px 14px 18px}
.saved{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:14px;background:var(--green-soft);color:var(--green);font-weight:700;font-size:14px;text-align:center}
.saved .num{font-size:18px}
.rc .scanbar{position:absolute;left:0;right:0;height:3px;background:var(--blue);box-shadow:0 0 14px 3px rgba(10,91,211,.45);top:0;animation:scan 1.4s ease-in-out 1 forwards}
@keyframes scan{from{top:4%}to{top:92%}}

/* share chips on Dina's phone after receipt */
.shares{display:flex;flex-direction:column;gap:8px}
.share{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:#fff;box-shadow:var(--sh-card)}
.share .s-n{font-weight:700;font-size:15px}
.share .s-m{font-size:12.5px;color:var(--ink-3);font-weight:600}
.share .s-a{text-align:right;font-weight:800;font-size:17px}
.share .s-a small{display:block;font-size:12px;color:var(--ink-3);font-weight:600}

/* QR handover */
.qrbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;border-radius:var(--r-card);background:#fff;box-shadow:var(--sh-card)}
.qr{width:150px;height:150px;display:grid;grid-template-columns:repeat(11,1fr);gap:2px;padding:8px;background:#fff;border:2px solid var(--ink);border-radius:10px}
.qr i{background:var(--ink);border-radius:1px}
.qr i.o{background:transparent}
.handlist{display:flex;flex-direction:column;gap:8px}
.hand{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:#fff;box-shadow:var(--sh-card);font-weight:700}
.hand .h-s{font-size:13px}

/* friend screens */
.ask{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:var(--r-card);background:#fff;box-shadow:var(--sh-card)}
.ask .paste{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border-radius:12px;background:#f6f3ec;font-size:14px;color:var(--ink-2);font-weight:600;overflow:hidden}
.ask .paste .ic{color:var(--ink-3)}
.ask .found{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.ask .found .art{width:56px;height:56px}
.ask .ai{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--blue)}
.ask .ai .ic{width:14px;height:14px}
.capset{display:flex;align-items:center;justify-content:space-between;gap:10px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:22px;font-weight:700;cursor:pointer;line-height:1}
.step .v{min-width:86px;text-align:center;font-size:22px;font-weight:800}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:88%;padding:10px 12px;border-radius:16px 16px 16px 4px;background:#fff;box-shadow:var(--sh-card);font-size:14.5px;font-weight:500}
.bub.me{align-self:flex-end;border-radius:16px 16px 4px 16px;background:var(--ink);color:#fff}
.bub .bt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);font-weight:700;margin-bottom:4px}
.bub .bt .ic{width:14px;height:14px}
.swapcards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:14px;background:#fff;border:2px solid var(--line);cursor:pointer;font-weight:700;font-size:14px;min-height:44px}
.sw .art{width:52px;height:52px}
.sw .d{font-size:12px;color:var(--ink-3);font-weight:600}
.sw[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.wait{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 12px;border-radius:var(--r-card);border:2px dashed var(--line);color:var(--ink-3);font-weight:600;text-align:center}
.wait .ic{width:30px;height:30px}

/* PayPal approval sheet (inside the friend phone) */
.pp{position:absolute;inset:auto 0 0 0;z-index:5;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -18px 40px -14px rgba(11,24,56,.45);padding:12px 16px 18px;animation:up .28s ease-out}
.phone{position:relative}
/* each step's main button stays reachable: pinned to the bottom of the phone screen */
.ph-body>.btn[data-act="do"],.ph-body>.btn[data-act="replay"]{position:sticky;bottom:0;z-index:3;box-shadow:0 0 0 10px #fbf8f2;margin-top:auto}
.ph-body>.btn.cue{box-shadow:0 0 0 3px var(--blue),0 0 0 10px #fbf8f2}
@media (max-width:699px){
  .pp{position:fixed;left:8px;right:8px;bottom:calc(var(--guide-h) + 12px);z-index:41;border-radius:22px}
  /* the step's main button stays in the thumb zone, above the guide bar */
  .ph-body>.btn[data-act="do"],.ph-body>.btn[data-act="replay"]{bottom:calc(var(--guide-h) + 14px)}
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.pp .grab{width:40px;height:5px;border-radius:9px;background:#d9dde6;margin:0 auto 10px}
.pp .pp-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pp .ppl{font-weight:800;font-size:19px;letter-spacing:-.01em;color:#003087}
.pp .ppl b{color:#0070e0}
.pp .sbx{font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-soft);padding:3px 8px;border-radius:999px}
.pp .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eef0f4;font-size:14.5px}
.pp .row b{font-size:16px}
.pp .hold{display:flex;align-items:center;gap:8px;margin:10px 0 12px;padding:10px 12px;border-radius:12px;background:var(--blue-soft);color:var(--blue-2);font-size:13.5px;font-weight:700}
.pp .hold .ic{width:18px;height:18px}

/* ---------- money rail (PayPal ledger) ---------- */
.rail-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px}
.rail-h h2{display:flex;align-items:center;gap:8px;margin:0;font-size:17px}
.rail-h h2 .ic{width:20px;height:20px;color:var(--yellow)}
.rail-x{display:grid;place-items:center;width:44px;height:44px;border-radius:999px;border:0;background:var(--navy-2);color:var(--on-navy);cursor:pointer}
@media (min-width:700px){.rail-x{display:none}}
.grabber{width:40px;height:5px;border-radius:9px;background:var(--navy-line);margin:0 auto}
@media (min-width:700px){.grabber{display:none}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{padding:10px 12px;border-radius:14px;background:var(--navy-2)}
.kpi .k{font-size:12px;color:var(--on-navy-2);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.kpi.zero .v{color:#7fe0b3}
.mrow{padding:10px 0;border-top:1px solid var(--navy-line)}
.mrow .mh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.mrow .mn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
.mrow .ms{font:600 12px/1 var(--mono);padding:4px 7px;border-radius:6px;background:var(--navy-2);color:var(--on-navy-2);white-space:nowrap}
.mrow .ms.h{background:#17346f;color:#cfe0ff}
.mrow .ms.c{background:#0f4a37;color:#9ff0cb}
.mrow .ms.v{background:#3b3f4d;color:#dfe3ec}
.bar{position:relative;height:26px;border-radius:8px;background:var(--navy-2);overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,#2f6fe0,#5b8ff0);transition:width .7s cubic-bezier(.3,.9,.3,1),background .4s}
.bar .fill.c{background:linear-gradient(90deg,#0fa46a,#38c58b)}
.bar .rest{position:absolute;top:0;bottom:0;border-radius:0 8px 8px 0;background:repeating-linear-gradient(45deg,#3a4f8a 0 4px,#1d2f63 4px 9px);transition:left .7s cubic-bezier(.3,.9,.3,1),width .7s cubic-bezier(.3,.9,.3,1)}
.bar .bl{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font:700 12.5px/1 var(--font);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.bar.empty .bl{color:var(--on-navy-2);text-shadow:none}
.mfoot{display:flex;justify-content:space-between;margin-top:5px;font-size:12px;color:var(--on-navy-2);font-weight:600}
.api{margin-top:12px;padding:10px 12px;border-radius:12px;background:#08122b;font:500 12px/1.6 var(--mono);color:#a9b6dd;min-height:86px}
.api .al{display:flex;gap:6px;opacity:.55}
.api .al:last-child{opacity:1;color:#fff}
.api .m{color:var(--yellow);font-weight:700}
.api .ok{color:#7fe0b3}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--on-navy-2);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}

/* footer summary */
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:14px;border-radius:var(--r-card);background:#fff;box-shadow:var(--sh-card)}
.sum .si{display:flex;flex-direction:column;gap:2px;padding:4px 6px}
.sum .si b{font-size:22px;letter-spacing:-.01em}
.sum .si span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.sum .si.z b{color:var(--green)}
.foot-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:12.5px;color:var(--ink-3);font-weight:600}
@media (min-width:700px){.sum{grid-template-columns:repeat(4,1fr)}}
.stamp{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--amber);border:1.5px dashed var(--amber);border-radius:8px;padding:3px 8px}

</style>

  { id: "split",    stage: 3, side: "dina",  friend: "ayu",  guide: "Each friend gets an exact share. Dewi's hold is released." },
  { id: "meet",     stage: 4, side: "friend",friend: "ayu",  guide: "Back home. Ayu scans Dina's code when she gets her bag." },
  { id: "paid",     stage: 4, side: "dina",  friend: "ayu",  guide: "Ayu paid exactly her share. The rest was never taken." },
  { id: "done",     stage: 4, side: "dina",  friend: "ayu",  guide: "Done. No one paid upfront. No one paid too much." },
];
const STEP = Object.fromEntries(STEPS.map((s, i) => [s.id, i]));
const MAX_BAR = 2000; // yen at 100% bar width

const S = {
  step: 0,
  role: "dina",          // which phone a narrow screen shows
  focus: "ayu",          // which friend's phone is shown
  capAyu: 1500,
  swap: "alt",           // "alt" | "skip"
  sheet: false,          // money sheet open on phones
  anim: false,           // true right after a forward step (play entry animations)
  prev: -1,
};

const at = (id) => S.step >= STEP[id];
const friend = (id) => FRIENDS.find((f) => f.id === id);
const capOf = (f) => (f.id === "ayu" ? S.capAyu : f.cap);
const holdOf = (f) => capOf(f) + f.fee;

// What happened to one friend's request, at the current step.
function fate(f) {
  const shop = SHOP[f.id];
  if (shop.outcome === "found") return { kind: "found", price: shop.price, line: shop.line, art: f.art, label: f.short };
  if (shop.outcome === "swap") {
    if (S.swap === "skip") return { kind: "skip" };
    return { kind: "swap", price: shop.alt.price, line: shop.alt.line, art: shop.alt.art, label: shop.alt.label };
  }
  return { kind: "none" };
}

// Money state of one friend's PayPal hold.
function money(f) {
  const hold = holdOf(f);
  const approved = at("shelf") || (S.step === STEP.approve && f.id !== "ayu");
  const fa = fate(f);
  const released = (fa.kind === "none" && at("split")) || (fa.kind === "skip" && at("till"));
  const share = (fa.kind === "found" || fa.kind === "swap") && at("split") ? fa.price + f.fee : null;
  const captured = share != null && (at("done") || (at("paid") && f.id === "ayu"));
  const renewed = approved && !released && at("meet") && !captured;
  let status = "none";
  if (approved) status = "held";
  if (share != null) status = "exact";
  if (renewed) status = "renewed";
  if (released) status = "void";
  if (captured) status = "captured";
  return { hold, approved, share, captured, released, renewed, status, never: share != null ? hold - share : released ? hold : 0 };
}

function totals() {
  let held = 0, charged = 0, released = 0, fees = 0, exact = 0;
  for (const f of FRIENDS) {
    const m = money(f);
    if (m.approved && !m.released && !m.captured) held += m.share ?? m.hold;
    if (m.captured) { charged += m.share; fees += f.fee; exact++; }
    if (m.released) released += m.hold;
    if (m.share != null && !m.released) released += m.hold - m.share;
  }
  const till = FRIENDS.reduce((s, f) => { const fa = fate(f); return s + (at("split") && fa.price ? fa.price : 0); }, 0) + (at("split") ? RECEIPT.others.reduce((s, o) => s + o.price, 0) : 0);
  return { held, charged, released, fees, exact, till };
}

// PayPal API calls made up to now (what the money rail prints).
function apiLog() {
  const L = [];
  const short = (f) => f.name;
  if (S.step >= STEP.approve) for (const f of FRIENDS) if (f.id !== "ayu") L.push({ m: "AUTHORIZE", who: short(f), amt: holdOf(f), r: "201" });
  if (at("shelf")) L.push({ m: "AUTHORIZE", who: "Ayu", amt: holdOf(friend("ayu")), r: "201" });
  if (S.swap === "skip" && at("till")) L.push({ m: "VOID", who: "Bima", amt: holdOf(friend("bima")), r: "VOIDED" });
  if (at("split")) L.push({ m: "VOID", who: "Dewi", amt: holdOf(friend("dewi")), r: "VOIDED" });
  if (at("meet")) for (const f of FRIENDS) { const m = money(f); if (m.share != null) L.push({ m: "REAUTHORIZE", who: short(f), amt: m.hold, r: "day 6" }); }
  if (at("paid")) L.push({ m: "CAPTURE", who: "Ayu", amt: money(friend("ayu")).share, r: "COMPLETED" });
  if (at("done")) for (const f of FRIENDS) { const m = money(f); if (m.captured && f.id !== "ayu") L.push({ m: "CAPTURE", who: short(f), amt: m.share, r: "COMPLETED" }); }
  return L;
}

function go(n, opts = {}) {
  const next = Math.max(0, Math.min(STEPS.length - 1, n));
  S.prev = S.step;
  S.anim = !opts.jump && next === S.step + 1;
  if (next < STEP.swap) S.swap = "alt";
  if (next <= STEP.send && opts.jump) S.capAyu = 1500;
  S.step = next;
  S.focus = STEPS[next].friend;
  render();
}
const advance = (fromId) => { if (S.step === STEP[fromId]) go(S.step + 1); };

// Small view helpers shared by both phones and the money rail.
const ic = (id, cls = "ic") => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const art = (id, cls = "art") => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const av = (f, sm) => `<span class="av${sm ? " sm" : ""}" style="--c:${f.color}" aria-hidden="true">${f.name[0]}</span>`;
const isNow = (id) => S.step === STEP[id];
const cue = (id) => (isNow(id) ? " cue" : "");
const btn = (id, label, icon, cls = "btn-ink", extra = "") =>
  `<button type="button" class="btn ${cls}${cue(id)}" data-act="do" data-step="${id}"${extra}>${icon ? ic(icon) : ""}<span>${label}</span></button>`;
const pill = (cls, icon, text) => `<span class="pill ${cls}">${icon ? ic(icon) : ""}${text}</span>`;

// The state of one request as a luggage tag.
function tagState(f) {
  const m = money(f), fa = fate(f);
  const base = { cls: "", pill: "", amt: YEN(capOf(f)), sub: "max", art: f.art, label: f.short };
  if (!at("found")) {
    if (m.approved) return { ...base, cls: "held", pill: pill("", "i-lock", "Held") };
    if (isNow("approve")) return { ...base, pill: pill("n", "i-clock", "Waiting") };
    return base;
  }
  if (fa.kind === "none") return { ...base, cls: "none", pill: pill("n", "i-x", m.released ? "Released" : "Not here") };
  if (fa.kind === "skip") return { ...base, cls: "none", pill: pill("n", "i-x", "Skipped") };
  if (fa.kind === "swap" && S.step <= STEP.swap) return { ...base, cls: "swap", pill: pill("a", "i-swap", isNow("swap") ? "Asked" : "Sold out"), amt: "—", sub: "" };
  const st = { ...base, art: fa.art, label: fa.label, amt: YEN(fa.price), sub: "shelf" };
  if (m.captured) return { ...st, cls: "paid", pill: pill("g", "i-check", "Paid"), amt: YEN(m.share), sub: "paid" };
  if (m.share != null) return { ...st, cls: "found", pill: pill("g", "i-check", fa.kind === "swap" ? "Swapped" : "Found"), amt: YEN(m.share), sub: "exact" };
  return { ...st, cls: "found", pill: pill("g", "i-check", fa.kind === "swap" ? "Swapped" : "Found") };
}

function tagHTML(f, opts = {}) {
  const t = tagState(f);
  const isNew = opts.isNew && S.anim ? " new" : "";
  return `<div class="tag ${t.cls}${isNew}" id="tag-${f.id}">
    ${art(t.art)}
    <div><div class="t-n">${t.label}</div><div class="t-m">${av(f, true)}${f.name}${t.pill ? " " + t.pill : ""}</div></div>
    <div class="t-r"><span class="amt num">${t.amt}</span><span class="cap">${t.sub}</span></div>
    ${opts.after || ""}
  </div>`;
}

const pass = (state) => `<div class="pass">
  <div><div class="city">CGK</div><div class="cn">Jakarta</div></div>
  <div class="mid">${ic("i-plane")}<span>1–6 Nov</span></div>
  <div class="to"><div class="city">HND</div><div class="cn">Tokyo</div></div>
</div>${state ? `<div style="display:flex;justify-content:center">${state}</div>` : ""}`;

  const hit = (id) => (scanned ? " hit" : "");
  const r1 = [

  ].join("");
  const r2 = [
    slot("a-hadalabo", "¥968", scanned && "citra", hit()),

}

// One shop receipt, lines owned by friends.
function receiptHTML() {
  const lines = [];
  for (const f of FRIENDS) { const fa = fate(f); if (fa.price) lines.push({ f, text: fa.line, price: fa.price }); }
  for (const o of RECEIPT.others) lines.push({ f: null, text: o.line, price: o.price });
  const total = lines.reduce((s, l) => s + l.price, 0);
  const rows = lines.map((l, i) => `<div class="ln${l.f ? " mine" : ""}${S.anim ? "" : " on"}" style="--i:${i}">
      ${l.f ? av(l.f, true) : `<span class="av sm av-dina">D</span>`}<span class="jp">${l.text}</span><span class="p num">${YEN(l.price)}</span></div>`).join("");
  return `<div class="rc" id="receipt">${S.anim ? `<span class="scanbar"></span>` : ""}
    <div class="shop">${RECEIPT.shop}</div><div class="when">${RECEIPT.when}</div><hr>
    ${rows}<hr><div class="tot"><span>合計</span><span class="num">${YEN(total)}</span></div></div>`;
}

function qrHTML() {
  // deterministic pattern with the three finder squares
  let cells = "";
  for (let y = 0; y < 11; y++) for (let x = 0; x < 11; x++) {
    const finder = (x < 3 && y < 3) || (x > 7 && y < 3) || (x < 3 && y > 7);
    const ring = finder && !((x % 8 === 1) && (y % 8 === 1));
    const on = finder ? ring : ((x * 7 + y * 13 + x * y) % 3 === 0);
    cells += `<i class="${on ? "" : "o"}"></i>`;
  }
  return `<div class="qr" role="img" aria-label="Handover code">${cells}</div>`;
}

// Dina, the traveller.
function dinaPlace() {
  if (S.step <= STEP.day) return `${ic("i-home")}Jakarta`;
  if (S.step <= STEP.split) return `${ic("i-pin")}Tokyo`;
  return `${ic("i-home")}Jakarta`;
}

function dinaView() {
  const k = STEPS[S.step].id;
  const list = (opts = {}) => `<div class="tags">${FRIENDS.filter((f) => opts.all || f.id !== "ayu" || at("day")).map((f) => tagHTML(f, { isNew: f.id === "ayu" && isNow("day"), after: opts.after?.(f) })).join("")}</div>`;
  const reqHead = (n) => `<div class="sec-h"><span>${n} requests</span><span class="num">max ${YEN(FRIENDS.filter((f) => f.id !== "ayu" || at("day")).reduce((s, f) => s + capOf(f), 0))}</span></div>`;

  if (k === "trip") return `
    ${pass()}
    <ol class="how" aria-label="How it works">
      <li>${ic("i-tag")}<b>Friends ask</b><span>with a max price</span></li>
      <li>${ic("i-lock")}<b>PayPal holds</b><span>nothing charged</span></li>
      <li>${ic("i-receipt")}<b>1 receipt</b><span>sets exact prices</span></li>
      <li>${ic("i-qr")}<b>Pay on handover</b><span>rest never taken</span></li>
    </ol>
    
    ${btn("trip", "Open for requests", "i-tag")}`;

  if (k === "paste" || k === "send") return `
    ${pass(pill("g", "i-check", "Open for requests"))}
    ${reqHead(3)}${list()}
    <div class="wait">${ic("i-clock")}More coming in</div>`;

  if (k === "day") return `
    ${reqHead(4)}${list()}
    <div class="sec-h"><span>Shopping day</span></div>
    <div class="btn-row" role="group" aria-label="Shopping day">
      <button type="button" class="btn btn-ghost sm" disabled>Sun 1</button>
      <button type="button" class="btn btn-ink sm" aria-pressed="true">Mon 2</button>
      <button type="button" class="btn btn-ghost sm" disabled>Tue 3</button>
    </div>
    ${btn("day", "Ask 4 PayPal holds", "i-lock", "btn-pp")}`;

  if (k === "approve") return `
    <div class="hero"><span class="big num">3/4</span><span class="sub">holds approved</span></div>
    ${list()}
    <div class="wait">${ic("i-clock")}Waiting for Ayu</div>`;

  if (k === "shelf") return `
    ${shelfHTML(false)}
    <div class="hero"><span class="sub">4 requests on hold</span></div>
    
    ${btn("shelf", "Scan shelf", "i-scan")}`;

  if (k === "found") return `
    ${shelfHTML(true)}
    ${list()}
    ${btn("found", "Ask Bima for a swap", "i-swap")}`;

  if (k === "swap") return `
    ${list()}
    <div class="wait">${ic("i-chat")}Waiting for Bima</div>`;

  if (k === "till") {
    const items = FRIENDS.map(fate).filter((x) => x.price).length;
    return `
    <div class="hero"><span class="big num">${items}</span><span class="sub">items in the basket</span></div>
    ${list()}
    
    ${btn("till", "Pay & scan receipt", "i-camera")}`;
  }

  if (k === "split") return `
    ${receiptHTML()}
    <div class="shares">${FRIENDS.map((f) => {
      const m = money(f), fa = fate(f);
      if (m.released) return `<div class="share" style="opacity:.7">${av(f)}<div><div class="s-n">${f.name}</div><div class="s-m">${fa.kind === "skip" ? "Skipped" : "Not found"}</div></div><div class="s-a num">${YEN(0)}<small>hold released</small></div></div>`;
      return `<div class="share">${av(f)}<div><div class="s-n">${f.name}</div><div class="s-m num">${YEN(fa.price)} + ${YEN(f.fee)} fee</div></div><div class="s-a num">${YEN(m.share)}<small>of ${YEN(m.hold)} hold</small></div></div>`;
    }).join("")}</div>
    ${btn("split", "Fly home", "i-plane")}`;

  const hand = () => `<div class="handlist">${FRIENDS.filter((f) => money(f).share != null).map((f) => {
    const m = money(f);
    return `<div class="hand">${av(f)}<span>${f.name}</span><span class="h-s">${m.captured ? pill("g", "i-check", YEN(m.share)) : pill("n", "i-clock", YEN(m.share))}</span></div>`;
  }).join("")}</div>`;

  if (k === "meet") return `
    <div class="qrbox">${qrHTML()}<span class="pill">${ic("i-qr")}Show to Ayu</span></div>
    ${hand()}`;

  if (k === "paid") return `
    <div class="hero"><span class="pill g">${ic("i-check")}Ayu paid</span><span class="big num">${YEN(money(friend("ayu")).share)}</span></div>
    ${hand()}
    
    ${btn("paid", "Hand over Bima & Citra", "i-qr")}`;

  // done
  const t = totals();
  return `
    <div class="hero"><span class="sub">You earned</span><span class="big num">${YEN(t.fees)}</span><span class="pill g">${ic("i-check")}${t.exact} exact charges</span></div>
    ${hand()}
    
    <button type="button" class="btn btn-ghost" data-act="replay">${ic("i-replay")}<span>Replay</span></button>`;
}

function moneyLine(f) {
  const m = money(f);

    none: ["n", "i-clock", "No hold yet"],
    held: ["", "i-lock", `${YEN(m.hold)} on hold`],
    exact: ["", "i-lock", `${YEN(m.share)} to pay at handover`],
    renewed: ["", "i-renew", `${YEN(m.share)} to pay at handover`],
    void: ["g", "i-check", "Hold released · ¥0"],
    captured: ["g", "i-check", `Paid ${YEN(m.share)}`],
  }[m.status];
  return pill(map[0], map[1], map[2]);
}

  return `<div class="grab"></div>
    <div class="pp-h"><span class="ppl">Pay<b>Pal</b></span><span class="sbx">Sandbox</span></div>
    <div class="row"><span>Jastip · Dina, Tokyo</span><span>${art("a-kitkat", "art")}</span></div>
    <div class="row"><span>Up to</span><b class="num">${YEN(holdOf(f))}</b></div>
    <div class="row"><span>Item max + fee</span><span class="num">${YEN(capOf(f))} + ${YEN(f.fee)}</span></div>
    <div class="hold">${ic("i-lock")}Hold only. You pay the exact receipt price when you get the item.</div>
    <button type="button" class="btn btn-pp cue" data-act="do" data-step="approve">Agree &amp; hold</button>`;
}

// The PayPal money rail: one bar per friend. Blue = held, green = charged, hatched = never taken.
function railView() {
  const t = totals();
  const rows = FRIENDS.map((f) => {
    const m = money(f);
    const w = (n) => `${Math.max(0, Math.min(100, (n / MAX_BAR) * 100))}%`;
    let fill = "0%", rest = "0%", restLeft = "0%", fc = "", label = "", right = "", st = "", stc = "";
    if (m.status === "none") { st = "—"; label = "no hold"; }
    if (m.status === "held") { fill = w(m.hold); fc = ""; label = YEN(m.hold); st = "HELD"; stc = "h"; }
    if (m.status === "exact" || m.status === "renewed") { fill = w(m.share); restLeft = w(m.share); rest = w(m.hold - m.share); label = YEN(m.share); right = YEN(m.hold - m.share); st = m.status === "renewed" ? "RENEWED" : "HELD"; stc = "h"; }
    if (m.status === "captured") { fill = w(m.share); fc = "c"; restLeft = w(m.share); rest = w(m.hold - m.share); label = YEN(m.share); right = YEN(m.never); st = "CAPTURED"; stc = "c"; }
    if (m.status === "void") { restLeft = "0%"; rest = w(m.hold); label = ""; right = YEN(m.hold); st = "VOIDED"; stc = "v"; }
    return `<div class="mrow" id="m-${f.id}">
      <div class="mh"><span class="mn">${av(f, true)}${f.name}</span><span class="ms ${stc}">${st}</span></div>
      <div class="bar${m.status === "none" ? " empty" : ""}" role="img" aria-label="${f.name}: ${st.toLowerCase() || "no hold"} ${label}">
        <span class="fill ${fc}" style="width:${fill}"></span><span class="rest" style="left:${restLeft};width:${rest}"></span>
        <span class="bl"><span class="num">${label}</span><span class="num">${right}</span></span>
      </div>
    </div>`;
  }).join("");
  const log = apiLog().slice(-4);
  const api = log.length
    ? log.map((l) => `<div class="al"><span class="m">${l.m}</span><span>${l.who}</span><span class="num">${YEN(l.amt)}</span><span class="ok">${l.r}</span></div>`).join("")
    : `<div class="al" style="opacity:1">No PayPal calls yet</div>`;
  return `<div class="grabber"></div>
    <div class="rail-h"><h2 id="rail-h">${ic("i-wallet")}PayPal</h2><span class="stamp" style="color:#ffd27a;border-color:#ffd27a">Sandbox</span>
      <button type="button" class="rail-x" data-act="sheet-close" aria-label="Close PayPal panel">${ic("i-x")}</button></div>
    <div class="kpis">
      <div class="kpi zero"><div class="k">Paid upfront</div><div class="v num">¥0</div></div>
      <div class="kpi"><div class="k">${t.charged ? "Charged" : at("split") ? "To charge, exact" : "On hold"}</div><div class="v num">${YEN(t.charged || t.held)}</div></div>
    </div>
    ${rows}
    <div class="legend"><span><i style="background:#3f7ee8"></i>held</span><span><i style="background:#1fb57a"></i>charged</span><span><i style="background:repeating-linear-gradient(45deg,#3a4f8a 0 3px,#1d2f63 3px 6px)"></i>never taken</span></div>
    <div class="api" aria-label="PayPal API calls">${api}</div>`;
}

// Render everything and wire events (one delegated listener).
const $ = (s) => document.querySelector(s);
const wide = () => matchMedia("(min-width:1080px)").matches;
const tablet = () => matchMedia("(min-width:700px)").matches;

function stagesHTML() {
  const cur = STEPS[S.step].stage;
  return STAGES.map((s, i) => `<li><button type="button" class="stg${i < cur || (i === cur && S.step === STEPS.length - 1) ? " done" : ""}" data-act="stage" data-i="${i}"${i === cur ? ' aria-current="step"' : ""}>
    <span class="dot">${ic(i < cur ? "i-check" : s.icon)}</span><span>${s.label}</span></button></li>`).join("");
}

function guideHTML() {
  const st = STEPS[S.step];
  const other = !wide() && S.role !== st.side;
  const who = st.side === "dina" ? "Dina" : friend(st.friend).name;
  const n = `<span class="g-n num">${S.step + 1}/${STEPS.length}</span>`;
  const go = other
    ? `<button type="button" class="g-go cue" data-act="role" data-role="${st.side}">${ic("i-arrow")}${who}'s phone</button>`
    : "";
  return `${n}<span class="g-t">${st.guide}</span>${go}`;
}

function footHTML() {
  const t = totals();
  const swaps = at("swap") && S.step > STEP.swap && S.swap === "alt" ? 1 : 0;
  return `<div class="sum" aria-label="This run">
      <div class="si z"><b class="num">¥0</b><span>paid upfront</span></div>
      <div class="si"><b class="num">${YEN(t.charged)}</b><span>charged, exact</span></div>
      <div class="si"><b class="num">${YEN(t.released)}</b><span>never taken</span></div>
      <div class="si"><b class="num">${swaps}</b><span>swap${swaps === 1 ? "" : "s"} approved</span></div>
    </div>
    <div class="foot-row"><span class="stamp">Simulation · sandbox data</span>
      <button type="button" class="btn btn-ghost sm" data-act="replay">${ic("i-replay")}<span>Replay</span></button></div>`;
}

let toastT;
function toast(text) {
  const el = $("#toast");
  el.innerHTML = `${ic("i-wallet")}${text}`;
  el.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove("show"), 2200);
}

function render() {
  const st = STEPS[S.step];
  // on narrow screens follow the step's side unless the user picked a phone
  document.body.dataset.role = S.role;
  $("#stages").innerHTML = stagesHTML();
  $("#dina-place").innerHTML = dinaPlace();
  $("#dina-body").innerHTML = dinaView();
  $("#friend-tabs").innerHTML = friendTabs();
  $("#friend-body").innerHTML = friendView();
  const showPP = isNow("approve") && S.focus === "ayu" && (wide() || S.role === "friend");
  $("#pp").hidden = !showPP;
  $("#pp").innerHTML = showPP ? ppSheet() : "";
  $("#rail-in").innerHTML = railView();
  $("#guide").innerHTML = guideHTML();
  $("#foot").innerHTML = footHTML();
  const f = friend(S.focus);
  $("#role-friend-av").textContent = f.name[0];
  $("#role-friend-av").style.setProperty("--c", f.color);
  $("#role-friend-name").textContent = f.name;
  $("#role-dina").setAttribute("aria-pressed", S.role === "dina");
  $("#role-friend").setAttribute("aria-pressed", S.role === "friend");
  const t = totals();
  $("#money-n").textContent = YEN(t.charged || t.held);
  const rail = $("#rail");
  rail.classList.toggle("open", S.sheet);
  $("#scrim").hidden = !(S.sheet && !tablet());
  $("#money-btn").setAttribute("aria-expanded", S.sheet);
  if (!tablet()) rail.setAttribute("aria-hidden", String(!S.sheet)); else rail.removeAttribute("aria-hidden");
  if (S.anim) {
    document.querySelectorAll(".rc .ln").forEach((el, i) => setTimeout(() => el.classList.add("on"), 250 + i * 180));
    const last = apiLog().slice(-1)[0];
    if (last && S.prev >= 0) {
      const before = (() => { const s = S.step; S.step = S.prev; const n = apiLog().length; S.step = s; return n; })();
      if (apiLog().length > before) toast(`${last.m} ${last.who} ${YEN(last.amt)}`);
    }
  }
  S.anim = false;
}

function act(el) {
  const a = el.dataset.act;
  if (a === "do") {
    const id = el.dataset.step;
    if (S.step !== STEP[id]) return;
    go(S.step + 1);
    const nx = STEPS[S.step];
    if (!wide()) { S.role = nx.side; render(); }
    if (!tablet()) window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  if (a === "role") { S.role = el.dataset.role; if (S.role === "friend") S.focus = STEPS[S.step].friend; render(); if (!tablet()) window.scrollTo({ top: 0 }); return; }
  if (a === "focus") { S.focus = el.dataset.id; render(); return; }
  if (a === "cap") { S.capAyu = Math.max(800, Math.min(2500, S.capAyu + Number(el.dataset.d))); render(); return; }
  if (a === "swap") { S.swap = el.dataset.v; render(); return; }
  if (a === "stage") {
    const i = Number(el.dataset.i);
    const first = STEPS.findIndex((s) => s.stage === i);
    go(first, { jump: true });
    if (!wide()) { S.role = STEPS[S.step].side; render(); }
    return;
  }
  if (a === "sheet") { S.sheet = !S.sheet; render(); if (S.sheet) $("#rail .rail-x")?.focus(); return; }
  if (a === "sheet-close") { S.sheet = false; render(); $("#money-btn").focus(); return; }
  if (a === "replay") { S.capAyu = 1500; S.swap = "alt"; S.sheet = false; go(0, { jump: true }); S.role = "dina"; render(); window.scrollTo({ top: 0 }); }
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled) act(el);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.sheet) { S.sheet = false; render(); $("#money-btn").focus(); }
});
let lastW = innerWidth;
addEventListener("resize", () => { if ((lastW < 1080) !== (innerWidth < 1080) || (lastW < 700) !== (innerWidth < 700)) { S.sheet = false; render(); } lastW = innerWidth; });

render();

</script>
</body>
</html>
