<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jastip · Wallet + Chat prototype</title>
<link rel="stylesheet" href="ab.css">
<style>
#hint{max-width:440px;text-align:center;font-size:14px;color:var(--l2);min-height:40px}
#hint b{color:#fff;margin-right:4px}
#hint .go{margin-left:6px;padding:4px 10px;border-radius:99px;background:var(--blue);color:#fff;font-size:13px;font-weight:700}
</style></head>
<body><div class="board">
  <h1>Jastip · Wallet + Chat</h1>
  <div class="sub">One trip, played with real taps. Switch whose phone you're holding.</div>
  <div class="controls" role="group" aria-label="Whose phone">
    <button data-as="dina">Dina · traveller</button><button data-as="ayu">Ayu</button><button data-as="bima">Bima</button><button data-as="citra">Citra</button>
    <button data-act="replay">Replay</button>
  </div>
  <div id="hint"></div>
  <div class="phone" id="phone"><div class="island"></div><div class="statusbar"><span>9:41</span><span>●●● 100%</span></div><div class="screen" style="position:absolute;inset:0"></div><div class="toast" id="toast"></div><div class="homebar"></div></div>
</div>
<script src="ab.js"></script>
</body></html>
