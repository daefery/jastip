<h1>Pick a direction</h1>
<p><b>New:</b> <a href="c/index.html">C · Bag full flow</a> · <a href="e/index.html">E · Track full flow (Uber + money)</a>. Same two moments in each: a friend asks and holds, and the traveller's receipt becomes exact charges. Tell me A, B, C or D, or mix ("D, but chat like B").</p>
<div class="grid">
<figure><img src="a-wallet.png" alt="A Wallet"><figcaption><b>A · Wallet</b> Dark like Apple Wallet. Each request is a glowing card. Premium, money-first.</figcaption></figure>
<figure><img src="b-chat.png" alt="B Chat"><figcaption><b>B · Chat</b> The app is a group chat; holds, swaps and receipts are tappable bubbles. Closest to how jastip works today.</figcaption></figure>
<figure><img src="c-bag.png" alt="C Bag"><figcaption><b>C · Bag</b> Warm and playful. A dial for the max price, a bag that fills. Fewest words.</figcaption></figure>
